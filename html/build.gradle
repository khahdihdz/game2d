plugins {
    id 'java-library'
    id 'com.github.xpenatan.gdx-teavm' version "${teavmVersion}"
}
dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx:${gdxVersion}"
}
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
gdxTeaVM {
    assets.from(file('../core/assets'))
    webDefaults {
        mainClass = 'com.darkfantasy.game.WebLauncher'
        optimization = org.teavm.gradle.api.OptimizationLevel.BALANCED
        obfuscated = true
        minHeapSizeMb = 128
        maxHeapSizeMb = 1024
    }
    js('release') {
        outputDir = file("${buildDir}/dist")
        optimization = org.teavm.gradle.api.OptimizationLevel.BALANCED
        obfuscated = true
    }
}
tasks.register('dist') {
    group = 'distribution'
    description = 'Build the production browser bundle.'
    dependsOn 'gdx_teavm_web_js_release_build'
}
