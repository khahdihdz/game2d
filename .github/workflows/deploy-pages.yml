name: Build and Deploy Web Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete project source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/game2d
          mkdir -p /tmp/game2d
          cat source/game2d-source.txz.b64.a00 source/game2d-source.txz.b64.a01 source/game2d-source.txz.b64.a02a source/game2d-source.txz.b64.a02b source/game2d-source.txz.b64.a02c source/game2d-source.txz.b64.a02d source/game2d-source.txz.b64.01 source/game2d-source.txz.b64.02 source/game2d-source.txz.b64.03 > /tmp/game2d/source.txz.b64
          base64 -d /tmp/game2d/source.txz.b64 > /tmp/game2d/source.txz
          xz -t /tmp/game2d/source.txz
          tar -xJf /tmp/game2d/source.txz -C /tmp/game2d
          test -f /tmp/game2d/dark-fantasy-survivor/settings.gradle
          test -f /tmp/game2d/dark-fantasy-survivor/html/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8'

      - name: Build HTML5 production bundle
        working-directory: /tmp/game2d/dark-fantasy-survivor
        run: gradle --no-daemon --stacktrace html:dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/game2d/dark-fantasy-survivor/html/build/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
