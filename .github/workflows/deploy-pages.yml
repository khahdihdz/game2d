name: Build and Deploy Web Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project source
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f core/src/main/java/com/darkfantasy/game/DarkFantasyGame.java
          test -f html/src/main/java/com/darkfantasy/game/WebLauncher.java

      - name: Set up Python asset generator
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate normalized PNG assets
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_assets.py
          test -f core/assets/characters/player_idle_64.png
          test -f core/assets/enemies/zombie_64.png
          test -f core/assets/tiles/tileset_32.png
          test -f core/assets/ui/icons_32.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build HTML5 production bundle
        run: gradle --no-daemon --stacktrace html:dist

      - name: Verify Pages entry point
        shell: bash
        run: |
          set -euo pipefail
          test -f html/build/dist/webapp/index.html
          test -f html/build/dist/webapp/app.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: html/build/dist/webapp

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
