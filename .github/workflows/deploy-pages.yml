name: Build and Deploy Web Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore project archive
        shell: bash
        run: |
          mkdir -p /tmp/game2d
          base64 -d source/game2d.zip.b64 > /tmp/game2d/game2d.zip
          unzip -q /tmp/game2d/game2d.zip -d /tmp/game2d
          test -f /tmp/game2d/dark-fantasy-survivor/gradlew
          chmod +x /tmp/game2d/dark-fantasy-survivor/gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: /tmp/game2d/dark-fantasy-survivor/**/*.gradle*

      - name: Build HTML5 production bundle
        working-directory: /tmp/game2d/dark-fantasy-survivor
        run: ./gradlew --no-daemon --stacktrace html:dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/game2d/dark-fantasy-survivor/html/build/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
